apiVersion: v1
kind: Service
metadata:
  name: {{ include "poster.nginxFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "poster.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "poster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx