{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poster.secretName" . }}
  labels:
    {{- include "poster.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  SERPAPI_API_KEY: {{ .Values.secret.serpApiKey | quote }}
{{- end }}