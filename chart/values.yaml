namespace: posterapi
replicaCount: 1

image:
  repository: localhost:5000
  pullPolicy: IfNotPresent
  name: "poster-api"
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

persistence:
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""

nginx:
  replicaCount: 1
  image:
    repository: localhost:5000
    pullPolicy: IfNotPresent
    name: "nginx-poster"
    tag: ""
  service:
    type: ClusterIP
    port: 80
  resources: {}

secret:
  existingSecret: ""
  openaiApiKey: ""
  serpApiKey: ""

podAnnotations: {}
podLabels: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}